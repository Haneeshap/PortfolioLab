
services:
  postgres:
    image: postgres:17
    container_name: portfoliolab-postgres
    environment:
      POSTGRES_DB: portfoliolab
      POSTGRES_USER: portfoliolab
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliolab -d portfoliolab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

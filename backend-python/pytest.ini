[tool:pytest]
testpaths = ["backend-python/tests"]
python_files = ["test_*.py", " *_test.py"]
python_classes = []
python_functions = []
asyncio_mode = "legacy"
addopts = "--asyncio-mode=auto -v --tb=short"
cov_report = ["html", "term-missing"]
asyncio_plugins = ["pytest_asyncio"]
markers =
    contract: Contract tests - verify JSON shapes
    integration: Integration tests with testcontainers
    unit: Unit tests